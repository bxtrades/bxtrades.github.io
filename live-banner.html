<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BXTrades LIVE banner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* ===== EDIT HERE: colours and size =====
     You can also change size from the link, e.g. live-banner.html?height=110&seconds=8
     The text sizes itself to fill the bar. Add &font=40 to cap how big it gets. */
  :root{
    --paper:#f3efe6;
    --paper-2:#fbf9f4;
    --ink:#1d1c1a;
    --muted:#6a645a;
    --hi:#f6d64a;          /* highlighter yellow */
    --green:#1f7a4d;
    --red:#b5392b;
    --height:110px;        /* banner height. Taller bar = bigger text */
    --font:27px;           /* text size */
    --margin:16px;         /* gap around the bar */
    --chart-opacity:.13;   /* how visible the candles behind the text are (0 to 1) */
    --chart-speed:40s;     /* time for the chart to loop. Higher = slower */
  }
  html,body{margin:0; padding:0; background:transparent; overflow:hidden}
  body{display:flex; align-items:flex-end; justify-content:center; height:100vh; padding:var(--margin); padding-right:calc(var(--margin) + 6px); box-sizing:border-box}

  .bar{
    position:relative; width:100%; height:var(--height); display:flex;
    background:var(--paper); border:2.5px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
    font-family:"IBM Plex Sans",system-ui,Arial,sans-serif; color:var(--ink); overflow:hidden;
  }
  /* fixed name tag on the left */
  .tag{
    flex:none; display:flex; flex-direction:column; justify-content:center; gap:2px;
    padding:0 calc(var(--height) * .26); background:var(--ink); color:var(--paper); z-index:2;
  }
  .tag .name{font-family:"Source Serif 4",Georgia,serif; font-weight:700; font-size:calc(var(--height) * .29); line-height:1}
  .tag .name i{font-weight:400; color:#c9c2b3}
  .tag .live{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:calc(var(--height) * .13); letter-spacing:.14em; display:flex; align-items:center; gap:6px}
  .tag .dot{width:.7em; height:.7em; border-radius:50%; background:#e2463a; animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}

  .stage{position:relative; flex:1; min-width:0}
  /* faint candles drifting behind the text */
  .chart{position:absolute; inset:0; z-index:0; pointer-events:none; opacity:var(--chart-opacity);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .chart .move{display:flex; height:100%; will-change:transform; animation:drift var(--chart-speed) linear infinite}
  .chart svg{flex:none; height:100%; display:block}
  @keyframes drift{to{transform:translate3d(-50%,0,0)}}

  .slide{
    position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; gap:.45em; padding:0 .5em;
    font-size:var(--font); font-weight:500; line-height:1.15; white-space:nowrap;
    opacity:0; transform:translateY(55%); transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .slide.show{opacity:1; transform:none}
  .slide.out{opacity:0; transform:translateY(-55%)}
  .slide b{font-weight:700; background:linear-gradient(transparent 55%, var(--hi) 55%, var(--hi) 92%, transparent 92%); padding:0 .08em}
  .slide .soft{color:var(--muted)}
  .slide .mono{font-family:"IBM Plex Mono",monospace; font-weight:600}
  .ico{flex:none; width:1.45em; height:1.45em; border:2px solid var(--ink); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--paper-2)}
  .ico svg{width:58%; height:58%}
  .pill{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:.58em; letter-spacing:.08em; border:2px solid var(--ink); padding:.2em .55em; background:var(--paper-2)}
  .pill.yellow{background:var(--hi)}
  .code{font-family:"IBM Plex Mono",monospace; font-weight:600; letter-spacing:.06em; border:2px dashed var(--ink); background:var(--hi); padding:.05em .4em}
  .ad{font-family:"IBM Plex Mono",monospace; font-size:.5em; font-weight:600; color:var(--muted); border:1.5px solid var(--muted); padding:.1em .35em}

  /* progress line along the bottom */
  .progress{position:absolute; left:0; bottom:0; height:4px; width:0; background:var(--ink); z-index:2}
  .progress.run{animation:fill linear forwards}
  @keyframes fill{to{width:100%}}
</style>
</head>
<body>
  <div class="bar">
    <div class="stage" id="stage">
      <div class="chart"><div class="move" id="move"></div></div>
      <div class="progress" id="progress"></div>
    </div>
  </div>

<script>
  /* ===== EDIT HERE: the slides =====
     icon: chat, question, candle, bell, chart, people, gift, arrow, web, info
     <b>...</b> = yellow highlighter.  <span class="pill">FREE</span> = small badge.
     <span class="code">BXTRADES</span> = discount code box.  <span class="ad">AD</span> = advert label. */
  var SLIDES = [
    {icon:"question", text:'19 year old trader. <b>Ask me anything</b>'},
    {icon:"web",      text:'Free tools &amp; my backtests at <b>bxtrades.com</b>'},
    {icon:"chat",     text:'<span class="pill yellow">FREE</span> Join <b>BXT’s Community</b> on Discord'}
  ];

  /* Seconds each slide stays on screen. Or add ?seconds=8 to the link. */
  var SECONDS = 6;

  var ICONS = {
    question:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .8c0 1.8-2.5 2.2-2.5 4"/><path d="M12 17.5h.01"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
    people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg>',
    candle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v3M8 17v4M16 6v3M16 18v3"/><rect x="5.5" y="6" width="5" height="11" fill="currentColor"/><rect x="13.5" y="9" width="5" height="9"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
    chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
    gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3-5-1s3 1 5 1zm0 0c1.5-3 5-3 5-1s-3 1-5 1z"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 11v6M12 7.5h.01"/></svg>'
  };

  var q = new URLSearchParams(location.search), root = document.documentElement.style;
  if (q.get("seconds")) SECONDS = parseFloat(q.get("seconds")) || SECONDS;
  if (q.get("height")) root.setProperty("--height", parseFloat(q.get("height")) + "px");

  var stage = document.getElementById("stage"), progress = document.getElementById("progress");
  var els = SLIDES.map(function(s){
    var d = document.createElement("div"); d.className = "slide";
    d.innerHTML = '<span class="ico">' + (ICONS[s.icon] || ICONS.chat) + '</span><span>' + s.text + '</span>';
    stage.appendChild(d); return d;
  });

  /* Looping candle chart: hollow green up candles, filled red down candles (like the website) */
  (function(){
    var N = 72, step = 16, W = N * step, H = 100, seed = 11;
    function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var pr = [];
    for (var k = 0; k < N; k++){ var t = 2 * Math.PI * k / N; pr.push(22 * Math.sin(t * 3) + 9 * Math.sin(t * 7 + 1) + (rnd() - 0.5) * 14); }
    pr.push(pr[0]);
    var bars = [], lo0 = Infinity, hi0 = -Infinity;
    for (var k = 0; k < N; k++){
      var o = pr[k], c = pr[k+1], hi = Math.max(o, c) + rnd() * 3.5 + 0.8, lo = Math.min(o, c) - rnd() * 3.5 - 0.8;
      bars.push([o, c, hi, lo]); lo0 = Math.min(lo0, lo); hi0 = Math.max(hi0, hi);
    }
    var sc = function(v){ return H - 8 - (v - lo0) / (hi0 - lo0) * (H - 16); }, g = "";
    bars.forEach(function(b, k){
      var x = k * step + 3, yo = sc(b[0]), yc = sc(b[1]), up = b[1] >= b[0], col = up ? "#1f7a4d" : "#b5392b";
      var top = Math.min(yo, yc), bh = Math.max(2, Math.abs(yo - yc));
      g += '<line x1="' + (x + 5) + '" x2="' + (x + 5) + '" y1="' + sc(b[2]).toFixed(1) + '" y2="' + sc(b[3]).toFixed(1) + '" stroke="' + col + '" stroke-width="1.4"/>';
      g += '<rect x="' + x + '" y="' + top.toFixed(1) + '" width="10" height="' + bh.toFixed(1) + '" fill="' + (up ? '#f3efe6' : col) + '" stroke="' + col + '" stroke-width="1.4"/>';
    });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:' + (W * 1.25) + 'px">' + g + '</svg>';
    document.getElementById("move").innerHTML = svg + svg;
  })();

  /* Make each slide's text as big as fits: fills about 92% of the width,
     but never taller than the bar allows. ?font= sets a maximum if you want it smaller. */
  var MAX_FONT = q.get("font") ? parseFloat(q.get("font")) : Infinity;
  function fit(){
    var h = stage.clientHeight, w = stage.clientWidth;
    els.forEach(function(el){
      el.style.fontSize = "20px";
      var a = el.firstElementChild.getBoundingClientRect(), b = el.lastElementChild.getBoundingClientRect();
      var natural = b.right - a.left;                     // width of icon + text at 20px
      var byWidth = 20 * (w * 0.92) / natural;
      var byHeight = h * 0.62;
      el.style.fontSize = Math.min(byWidth, byHeight, MAX_FONT) + "px";
    });
  }
  window.addEventListener("resize", fit);

  var i = -1;
  function next(){
    var prev = els[i];
    i = (i + 1) % els.length;
    var cur = els[i];
    if (prev) { prev.classList.remove("show"); prev.classList.add("out"); setTimeout(function(){ prev.classList.remove("out"); }, 600); }
    cur.classList.remove("out"); void cur.offsetWidth; cur.classList.add("show");
    progress.classList.remove("run"); progress.style.animationDuration = SECONDS + "s"; void progress.offsetWidth; progress.classList.add("run");
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){
    fit(); next(); setInterval(next, SECONDS * 1000);
  });
</script>
</body>
</html>
